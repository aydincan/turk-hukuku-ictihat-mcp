[project]
name = "turk-hukuku-ictihat-mcp"
version = "0.3.2"
description = "Türk yargı kararlarını (Yargıtay/Bölge Adliye + Danıştay + AYM bireysel başvuru) yapay zekâ araçlarına açan MCP sunucusu."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aydın Can Polatkan" }]
keywords = ["mcp", "turkish-law", "ictihat", "yargitay", "uyap", "case-law", "llm"]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "anyio>=4",
]

[project.scripts]
turk-hukuku-ictihat = "turk_hukuku_ictihat.server:main"

[project.urls]
Homepage = "https://turk-hukuku.com"
Documentation = "https://turk-hukuku.com/mcp/"
Repository = "https://github.com/aydincan/turk-hukuku-ictihat-mcp"
Issues = "https://github.com/aydincan/turk-hukuku-ictihat-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turk_hukuku_ictihat"]
